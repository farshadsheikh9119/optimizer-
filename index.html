<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بهینه‌ساز چیدمان بار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#16202b;
  --ink-soft:#5a6a7a;
  --paper:#f2f0eb;
  --panel:#ffffff;
  --line:#d9d6cf;
  --steel:#2c5c7a;
  --signal:#b8531f;
  --ok:#2f6b4f;
  --warn:#8a6d1f;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e8e6e1;--ink-soft:#a0a8b2;--paper:#12171d;--panel:#1a2128;
    --line:#2d3740;--steel:#7fb6d6;--signal:#e08a4e;--ok:#79c39b;--warn:#d9bd6a;
  }
}
:root[data-theme="dark"]{
  --ink:#e8e6e1;--ink-soft:#a0a8b2;--paper:#12171d;--panel:#1a2128;
  --line:#2d3740;--steel:#7fb6d6;--signal:#e08a4e;--ok:#79c39b;--warn:#d9bd6a;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:Vazirmatn,"Segoe UI",Tahoma,sans-serif;font-weight:400;
  line-height:1.7;font-size:15px;
}
.wrap{max-width:1180px;margin:0 auto;padding:28px 18px 60px}
header{border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:26px}
h1{font-size:28px;font-weight:700;margin:0 0 6px;letter-spacing:-.4px}
header p{margin:0;color:var(--ink-soft);max-width:62ch}
.drop{
  border:1.5px dashed var(--line);background:var(--panel);border-radius:10px;
  padding:26px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;
}
.drop:hover,.drop.over{border-color:var(--steel);background:color-mix(in srgb,var(--steel) 7%,var(--panel))}
.drop strong{display:block;font-size:17px;margin-bottom:4px}
.drop span{color:var(--ink-soft);font-size:13.5px}
input[type=file]{display:none}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0}
button{
  font-family:inherit;font-size:15px;font-weight:500;padding:10px 20px;border-radius:8px;
  border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;
}
button.ghost{background:transparent;color:var(--ink)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:22px 0}
.kpi{background:var(--panel);padding:14px 16px}
.kpi b{display:block;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--ink-soft)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:0}
.tabs button{
  background:transparent;color:var(--ink-soft);border:1px solid transparent;border-bottom:none;
  border-radius:8px 8px 0 0;padding:9px 14px;font-size:14px;
}
.tabs button[aria-selected=true]{background:var(--panel);color:var(--ink);border-color:var(--line);font-weight:500}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-top:none;border-radius:0 0 10px 10px;max-height:62vh;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;white-space:nowrap}
th,td{padding:8px 11px;border-bottom:1px solid var(--line);text-align:right}
th{position:sticky;top:0;background:var(--panel);font-weight:500;color:var(--ink-soft);z-index:1;box-shadow:inset 0 -1px 0 var(--line)}
td{font-variant-numeric:tabular-nums}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--ink) 3%,var(--panel))}
.note{font-size:13px;color:var(--ink-soft);padding:8px 4px}
.msg{padding:12px 15px;border-radius:8px;margin:14px 0;border:1px solid}
.msg.err{border-color:var(--signal);color:var(--signal);background:color-mix(in srgb,var(--signal) 8%,transparent)}
.msg.warn{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.hidden{display:none}
h2.sec{font-size:16px;font-weight:500;margin:26px 0 10px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>بهینه‌ساز چیدمان بار</h1>
  <p>فایل اکسل سفارش‌ها را بدهید تا برای هر شماره درخواست، کم‌هزینه‌ترین ترکیب ماشین انتخاب و کالاها روی ماشین‌ها چیده شود.</p>
</header>

<label class="drop" id="drop" style="display: block;">
  <strong>فایل اکسل را اینجا رها یا انتخاب کنید</strong>
  <span>باید شامل سه شیت باشد: سفارش، ظرفیت ماشین، هزینه بار</span>
  <input type="file" id="file" accept=".xlsx,.xlsm,.xls">
</label>

<div id="messages"></div>

<div class="bar hidden" id="actions">
  <button id="dl">دانلود خروجی اکسل</button>
  <button class="ghost" id="reset">فایل جدید</button>
</div>

<div id="result" class="hidden">
  <div class="kpis" id="kpis"></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="tablewrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
  <div class="note" id="rownote"></div>
</div>
</div>

<script>
/* ---------- کمک‌تابع‌ها ---------- */
const ZW=/[\u200b-\u200f\u202a-\u202e\u2066-\u2069]/g;
function norm(v){
  if(v==null) return "";
  return String(v)
    .replace(/[\u0660-\u0669]/g,d=>d.charCodeAt(0)-0x0660)
    .replace(/[\u06f0-\u06f9]/g,d=>d.charCodeAt(0)-0x06f0)
    .replace(/ي/g,"ی").replace(/ك/g,"ک").replace(/ۀ/g,"ه").replace(/ة/g,"ه")
    .replace(ZW,"").replace(/\s+/g," ").trim();
}
const key=v=>norm(v).replace(/\s/g,"");
function num(v){
  if(v==null||v==="") return null;
  if(typeof v==="number") return isFinite(v)?v:null;
  const s=norm(v).replace(/,/g,"").replace(/[^\d.\-]/g,"");
  if(s===""||s==="-") return null;
  const n=parseFloat(s);
  return isFinite(n)?n:null;
}
const r3=n=>Math.round((n+Number.EPSILON)*1000)/1000;
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const fmt=n=>typeof n==="number"?n.toLocaleString("fa-IR",{maximumFractionDigits:3}):(n??"");

/* ---------- خواندن شیت‌ها ---------- */
function sheetRows(wb,name){
  return XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null,blankrows:false});
}
function pickSheet(wb,words){
  for(const n of wb.SheetNames){ const k=key(n); if(words.some(w=>k.includes(w))) return n; }
  return null;
}
function headerRow(rows,mustWords){
  for(let i=0;i<Math.min(rows.length,25);i++){
    const ks=rows[i].map(key);
    if(mustWords.every(w=>ks.some(k=>k.includes(w)))) return i;
  }
  return -1;
}
function colFinder(headers){
  const ks=headers.map(key);
  return function(cands,{exact=false}={}){
    for(const c of cands){
      const ck=key(c);
      for(let i=0;i<ks.length;i++){
        if(!ks[i]) continue;
        if(exact? ks[i]===ck : ks[i].includes(ck)) return i;
      }
    }
    return -1;
  };
}

/* ---------- انتخاب بهینه ماشین (پوشش کم‌هزینه حجم) ---------- */
function bestFleet(volume,types){
  // types: [{name,cap,cost}]
  const usable=types.filter(t=>t.cap>0&&t.cost!=null&&t.cost>=0);
  if(!usable.length||volume<=0) return null;
  let unit=0.001;
  while(volume/unit>250000) unit*=10;
  const V=Math.ceil(volume/unit-1e-9);
  const caps=usable.map(t=>Math.max(1,Math.round(t.cap/unit)));
  const INF=Infinity;
  const dp=new Float64Array(V+1).fill(INF); dp[0]=0;
  const pick=new Int32Array(V+1).fill(-1);
  for(let v=1;v<=V;v++){
    for(let i=0;i<usable.length;i++){
      const prev=Math.max(0,v-caps[i]);
      if(dp[prev]===INF) continue;
      const c=dp[prev]+usable[i].cost;
      if(c<dp[v]){dp[v]=c;pick[v]=i;}
    }
  }
  if(dp[V]===INF) return null;
  const fleet=[]; let v=V;
  while(v>0){ const i=pick[v]; if(i<0) break; fleet.push(usable[i]); v=Math.max(0,v-caps[i]); }
  fleet.sort((a,b)=>b.cap-a.cap);
  return {fleet,cost:dp[V]};
}

/* ---------- موتور اصلی ---------- */
function solve(wb){
  const warn=[];
  const sOrd=pickSheet(wb,["سفارش","سفارشات","درخواست"]);
  const sCap=pickSheet(wb,["ظرفیتماشین","ظرفیت"]);
  const sCost=pickSheet(wb,["هزینهبار","هزینه","نرخ"]);
  if(!sOrd) throw new Error("شیت «سفارش» پیدا نشد.");
  if(!sCap) throw new Error("شیت «ظرفیت ماشین» پیدا نشد.");
  if(!sCost) throw new Error("شیت «هزینه بار» پیدا نشد.");

  // ظرفیت ماشین
  const capRows=sheetRows(wb,sCap);
  let ch=headerRow(capRows,["ظرفیت"]); if(ch<0) ch=0;
  const cf=colFinder(capRows[ch]);
  const cType=cf(["نوع ماشین","ماشین","نوع"]), cCap=cf(["ظرفیت"]);
  const capacity={};
  for(let i=ch+1;i<capRows.length;i++){
    const t=norm(capRows[i][cType]), c=num(capRows[i][cCap]);
    if(t&&c!=null&&c>0) capacity[t]=c;
  }
  if(!Object.keys(capacity).length) throw new Error("هیچ نوع ماشینی با ظرفیت معتبر در شیت ظرفیت ماشین یافت نشد.");

  // هزینه بار
  const costRows=sheetRows(wb,sCost);
  let hh=headerRow(costRows,["مقصد"]); if(hh<0) hh=0;
  const costHead=costRows[hh].map(norm);
  const destIdx=costHead.findIndex(h=>key(h).includes("مقصد"));
  const typeCols=[];
  costHead.forEach((h,i)=>{
    if(i===destIdx||!h) return;
    const match=Object.keys(capacity).find(t=>key(t)===key(h))||Object.keys(capacity).find(t=>key(h).includes(key(t)));
    if(match) typeCols.push({idx:i,name:match});
    else warn.push(`ستون «${h}» در شیت هزینه بار با هیچ نوع ماشینی در شیت ظرفیت مطابقت ندارد و نادیده گرفته شد.`);
  });
  const tariff={};
  for(let i=hh+1;i<costRows.length;i++){
    const d=norm(costRows[i][destIdx]); if(!d) continue;
    const row={};
    typeCols.forEach(tc=>{ const v=num(costRows[i][tc.idx]); if(v!=null&&v>0) row[tc.name]=v; });
    tariff[key(d)]={dest:d,rates:row};
  }

  // سفارش‌ها
  const ordRows=sheetRows(wb,sOrd);
  let oh=headerRow(ordRows,["درخواست"]); if(oh<0) oh=0;
  const of_=colFinder(ordRows[oh]);
  const oReq=of_(["شماره درخواست","درخواست"]),
        oDest=of_(["نام انبار یا فروشگاه","انبار","فروشگاه","مقصد"]),
        oDate=of_(["تاریخ تحویل نهایی","تاریخ تحول نهایی","تاریخ"]),
        oCode=of_(["کد قرن","کد کالا","کد"]),
        oName=of_(["نام کالا","کالا"]),
        oQty=of_(["سفارش"],{exact:true})>=0?of_(["سفارش"],{exact:true}):of_(["مقدار سفارش","سفارش"]),
        oSend=of_(["ارسال"]),
        oCity=of_(["شهر"],{exact:true});
  if(oReq<0||oDest<0||oSend<0) throw new Error("ستون‌های «شماره درخواست»، «نام انبار یا فروشگاه» یا «ارسال» در شیت سفارش پیدا نشد.");

  const groups=new Map();
  for(let i=oh+1;i<ordRows.length;i++){
    const row=ordRows[i];
    const req=norm(row[oReq]); const dest=norm(row[oDest]);
    if(!req||!dest) continue;
    const send=num(row[oSend])||0;
    const order=oQty>=0?(num(row[oQty])??send):send;
    const item={
      code:norm(row[oCode>=0?oCode:-1])||"",
      name:norm(row[oName>=0?oName:-1])||"",
      order, send,
      date: oDate>=0?(row[oDate]??""):"",
      remaining:send
    };
    const gk=req+"||"+dest;
    if(!groups.has(gk)) groups.set(gk,{req,dest,city:oCity>=0?norm(row[oCity]):norm(dest),date:item.date,items:[]});
    groups.get(gk).items.push(item);
  }
  if(!groups.size) throw new Error("هیچ ردیف سفارش معتبری خوانده نشد.");

  /* --- حل هر درخواست --- */
  const detail=[],trucksOut=[],unserved=[];
  let totalCost=0,totalTrucks=0,totalCap=0,totalUsed=0,totalOrder=0,totalSend=0;

  for(const g of groups.values()){
    const vol=r3(g.items.reduce((s,it)=>s+it.send,0));
    const t=tariff[key(g.dest)];
    if(!t){
      unserved.push({dest:g.dest,req:g.req,reason:"مقصد در شیت هزینه بار وجود ندارد",vol});
      pushShortage(g,detail,"—","—");
      totalOrder+=g.items.reduce((s,i)=>s+i.order,0);
      continue;
    }
    const types=Object.entries(t.rates).map(([name,cost])=>({name,cap:capacity[name],cost})).filter(x=>x.cap>0);
    const sol=vol>0?bestFleet(vol,types):{fleet:[],cost:0};
    if(!sol){
      unserved.push({dest:g.dest,req:g.req,reason:"هیچ نوع ماشین مجازی برای این مقصد تعریف نشده",vol});
      pushShortage(g,detail,"—","—");
      totalOrder+=g.items.reduce((s,i)=>s+i.order,0);
      continue;
    }
    // شماره‌گذاری ماشین‌ها بر اساس نوع
    const counts={}; sol.fleet.forEach(f=>counts[f.name]=(counts[f.name]||0)+1);
    const seen={};
    const trucks=sol.fleet.map(f=>{
      seen[f.name]=(seen[f.name]||0)+1;
      return {type:f.name,cap:f.cap,cost:f.cost,label:`${seen[f.name]} از ${counts[f.name]}`,used:0,lines:[]};
    });

    // چیدمان: تا حد امکان هر کالا فقط روی یک ماشین می‌رود (بدون شکستن)؛
    // فقط وقتی هیچ ماشینی به‌تنهایی جای کل کالا را ندارد، آن کالا بین چند ماشین شکسته می‌شود.
    const items=[...g.items].sort((a,b)=>b.send-a.send);
    trucks.forEach(tr=>{tr.free=tr.cap;});
    for(const it of items){
      let remaining=it.remaining;
      if(remaining<=1e-9) continue;
      // بهترین جای بدون شکستن: کوچک‌ترین ماشینی که کل کالا در آن جا می‌شود
      let bestTr=null;
      for(const tr of trucks){
        if(tr.free>=remaining-1e-9 && (!bestTr||tr.free<bestTr.free)) bestTr=tr;
      }
      if(bestTr){
        bestTr.free=r3(bestTr.free-remaining);
        bestTr.used=r3(bestTr.used+remaining);
        bestTr.lines.push({it,qty:r3(remaining)});
        it.remaining=0;
        continue;
      }
      // هیچ ماشینی به‌تنهایی جا نمی‌دهد: ناچار شکسته می‌شود، از ماشین با بیشترین فضای خالی شروع کن
      const order=[...trucks].sort((a,b)=>b.free-a.free);
      for(const tr of order){
        if(remaining<=1e-9) break;
        if(tr.free<=1e-9) continue;
        const take=Math.min(tr.free,remaining);
        tr.free=r3(tr.free-take);
        tr.used=r3(tr.used+take);
        tr.lines.push({it,qty:r3(take)});
        remaining=r3(remaining-take);
      }
      it.remaining=r3(remaining);
    }
    const shipCap=r3(trucks.reduce((s,x)=>s+x.cap,0));
    const shipUsed=r3(trucks.reduce((s,x)=>s+x.used,0));
    const shipCost=trucks.reduce((s,x)=>s+x.cost,0);
    const shipOrder=r3(g.items.reduce((s,i)=>s+i.order,0));

    for(const tr of trucks){
      for(const l of tr.lines){
        const unmet=r3(Math.max(0,l.it.order-l.it.send));
        detail.push({
          "شهر":g.city,"نام انبار یا فروشگاه":g.dest,"شماره درخواست":g.req,"تاریخ تحویل نهایی":l.it.date||g.date,
          "کد قرن":l.it.code,"نام کالا":l.it.name,
          "مقدار سفارش":r3(l.it.order),"مقدار تخصیص‌یافته (روی این ماشین)":l.qty,
          "مقدار تأمین‌نشده":unmet,
          "درصد تأمین (%)":l.it.order>0?r2(l.it.send/l.it.order*100):100,
          "نوع ماشین":tr.type,"شماره ماشین (از کل هم‌نوع)":tr.label
        });
      }
      trucksOut.push({
        "شهر":g.city,"تاریخ تحویل نهایی":g.items[0]?.date||g.date,"شماره درخواست":g.req,
        "نوع ماشین":tr.type,"شماره ماشین (از کل هم‌نوع)":tr.label,
        "ظرفیت ماشین":r3(tr.cap),"ظرفیت استفاده‌شده این ماشین":r3(tr.used),"هزینه ماشین":tr.cost,
        "ظرفیت کل محموله":shipCap,"ظرفیت استفاده‌شده محموله":shipUsed,
        "ظرفیت خالی محموله":r3(shipCap-shipUsed),"هزینه حمل محموله":shipCost,
        "مقدار سفارش محموله":shipOrder,
        "درصد تأمین محموله (%)":shipOrder>0?r2(shipUsed/shipOrder*100):100
      });
    }
    // کالاهای بدون تخصیص (ارسال صفر) یا باقی‌مانده جا نشده
    for(const it of g.items){
      const placed=trucks.some(tr=>tr.lines.some(l=>l.it===it));
      if(!placed){
        detail.push({
          "شهر":g.city,"نام انبار یا فروشگاه":g.dest,"شماره درخواست":g.req,"تاریخ تحویل نهایی":it.date,
          "کد قرن":it.code,"نام کالا":it.name,"مقدار سفارش":r3(it.order),
          "مقدار تخصیص‌یافته (روی این ماشین)":0,"مقدار تأمین‌نشده":r3(it.order),
          "درصد تأمین (%)":0,"نوع ماشین":"بدون ارسال","شماره ماشین (از کل هم‌نوع)":"—"
        });
      }
      if(it.remaining>1e-6){
        detail.push({
          "شهر":g.city,"نام انبار یا فروشگاه":g.dest,"شماره درخواست":g.req,"تاریخ تحویل نهایی":it.date,
          "کد قرن":it.code,"نام کالا":it.name,"مقدار سفارش":r3(it.order),
          "مقدار تخصیص‌یافته (روی این ماشین)":0,"مقدار تأمین‌نشده":r3(it.remaining),
          "درصد تأمین (%)":0,"نوع ماشین":"بارگیری‌نشده","شماره ماشین (از کل هم‌نوع)":"—"
        });
      }
    }
    totalCost+=shipCost; totalTrucks+=trucks.length; totalCap+=shipCap; totalUsed+=shipUsed;
    totalOrder+=shipOrder; totalSend+=shipUsed;
  }

  function pushShortage(g,arr){
    for(const it of g.items){
      arr.push({
        "شهر":g.city,"نام انبار یا فروشگاه":g.dest,"شماره درخواست":g.req,"تاریخ تحویل نهایی":it.date,
        "کد قرن":it.code,"نام کالا":it.name,"مقدار سفارش":r3(it.order),
        "مقدار تخصیص‌یافته (روی این ماشین)":0,"مقدار تأمین‌نشده":r3(it.order),
        "درصد تأمین (%)":0,"نوع ماشین":"بدون نرخ","شماره ماشین (از کل هم‌نوع)":"—"
      });
    }
  }

  /* --- کالاهای کمبوددار --- */
  const byItem=new Map();
  for(const d of detail){
    const k=d["کد قرن"]+"||"+d["نام کالا"];
    if(!byItem.has(k)) byItem.set(k,{code:d["کد قرن"],name:d["نام کالا"],order:0,alloc:0,seen:new Set()});
    const o=byItem.get(k);
    const rk=d["شماره درخواست"]+"|"+d["کد قرن"];
    if(!o.seen.has(rk)){o.seen.add(rk);o.order+=d["مقدار سفارش"];}
    o.alloc+=d["مقدار تخصیص‌یافته (روی این ماشین)"];
  }
  const shortages=[...byItem.values()].map(o=>({
    "کد قرن":o.code,"نام کالا":o.name,"مجموع سفارش":r3(o.order),"مجموع تخصیص":r3(o.alloc),
    "مجموع کمبود":r3(Math.max(0,o.order-o.alloc)),
    "درصد تأمین (%)":o.order>0?r2(Math.min(o.alloc,o.order)/o.order*100):100
  })).filter(x=>x["مجموع کمبود"]>0.0005).sort((a,b)=>b["مجموع کمبود"]-a["مجموع کمبود"]);

  /* --- شهرها --- */
  const byCity=new Map();
  for(const t of trucksOut){
    const c=t["شهر"];
    if(!byCity.has(c)) byCity.set(c,{cost:0,cap:0,used:0,order:0,ships:new Set()});
    const o=byCity.get(c);
    o.cost+=t["هزینه ماشین"]; o.cap+=t["ظرفیت ماشین"]; o.used+=t["ظرفیت استفاده‌شده این ماشین"];
    if(!o.ships.has(t["شماره درخواست"])){o.ships.add(t["شماره درخواست"]);o.order+=t["مقدار سفارش محموله"];}
  }
  const cities=[...byCity.entries()].map(([c,o])=>({
    "شهر":c,"هزینه کل حمل":o.cost,
    "درصد بهره‌وری ماشین (%)":o.cap>0?r2(o.used/o.cap*100):0,
    "مجموع تخصیص (کارتن)":r3(o.used),
    "درصد تأمین (%)":o.order>0?r2(o.used/o.order*100):100
  })).sort((a,b)=>b["هزینه کل حمل"]-a["هزینه کل حمل"]);

  /* --- ناوگان --- */
  const byType=new Map();
  for(const t of trucksOut){
    const k=t["نوع ماشین"];
    if(!byType.has(k)) byType.set(k,{n:0,cap:0,used:0,cost:0});
    const o=byType.get(k); o.n++; o.cap+=t["ظرفیت ماشین"]; o.used+=t["ظرفیت استفاده‌شده این ماشین"]; o.cost+=t["هزینه ماشین"];
  }
  const fleet=[...byType.entries()].map(([k,o])=>({
    "نوع ماشین":k,"تعداد ماشین":o.n,"ظرفیت کل":r3(o.cap),"ظرفیت استفاده‌شده":r3(o.used),
    "درصد بهره‌وری (%)":o.cap>0?r2(o.used/o.cap*100):0,"هزینه کل":o.cost
  })).sort((a,b)=>b["هزینه کل"]-a["هزینه کل"]);

  const totalUnmet=r3(Math.max(0,totalOrder-totalSend));
  const overall=[
    ["هزینه کل حمل",totalCost],
    ["هزینه حمل به ازای هر واحد",totalSend>0?Math.round(totalCost/totalSend):0],
    ["تعداد درخواست‌ها",groups.size],
    ["تعداد کل ماشین‌ها",totalTrucks],
    ["مجموع مقدار سفارش",r3(totalOrder)],
    ["مجموع مقدار تخصیص‌یافته",r3(totalSend)],
    ["مجموع مقدار تأمین‌نشده",totalUnmet],
    ["درصد تأمین کلی (%)",totalOrder>0?r2(totalSend/totalOrder*100):100],
    ["ظرفیت کل ماشین‌های انتخاب‌شده",r3(totalCap)],
    ["ظرفیت کل استفاده‌شده",r3(totalUsed)],
    ["ظرفیت خالی",r3(totalCap-totalUsed)],
    ["درصد بهره‌وری ناوگان (%)",totalCap>0?r2(totalUsed/totalCap*100):0],
    ["تعداد ردیف جزئیات",detail.length],
    ["تعداد کالاهای دارای کمبود",shortages.length]
  ].map(([a,b])=>({"شاخص":a,"مقدار":b}));

  const issues=unserved.map(u=>({"شماره درخواست":u.req,"مقصد":u.dest,"حجم بار":u.vol,"مشکل":u.reason}));
  warn.forEach(w=>issues.push({"شماره درخواست":"—","مقصد":"—","حجم بار":"","مشکل":w}));

  return {
    sheets:{
      "جزئیات سفارش":detail,
      "خلاصه شهرها":trucksOut,
      "خلاصه کلی":overall,
      "رتبه‌بندی شهرها":cities,
      "کالاهای کمبود دار":shortages,
      "خلاصه ناوگان":fleet,
      "هشدارها":issues
    },
    kpi:{totalCost,totalTrucks,groups:groups.size,fill:totalCap>0?r2(totalUsed/totalCap*100):0,
         fulfil:totalOrder>0?r2(totalSend/totalOrder*100):100,unmet:totalUnmet},
    warn,issues
  };
}

/* ---------- رابط کاربری ---------- */
let RESULT=null,ACTIVE=null;
const $=id=>document.getElementById(id);
const drop=$("drop"),fileInput=$("file");

["dragover","dragenter"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove("over")}));
drop.addEventListener("drop",ev=>{ if(ev.dataTransfer.files[0]) handle(ev.dataTransfer.files[0]); });
fileInput.addEventListener("change",()=>{ if(fileInput.files[0]) handle(fileInput.files[0]); });
$("reset").addEventListener("click",()=>{ location.reload(); });
$("dl").addEventListener("click",download);

function msg(text,cls){ $("messages").insertAdjacentHTML("beforeend",`<div class="msg ${cls}">${text}</div>`); }

async function handle(file){
  $("messages").innerHTML="";
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:"array"});
    RESULT=solve(wb);
    render();
  }catch(e){
    console.error(e);
    msg("خواندن فایل ناموفق بود: "+e.message,"err");
    $("result").classList.add("hidden"); $("actions").classList.add("hidden");
  }
}

function render(){
  const k=RESULT.kpi;
  $("kpis").innerHTML=[
    ["هزینه کل حمل",fmt(k.totalCost)],["تعداد ماشین",fmt(k.totalTrucks)],
    ["تعداد درخواست",fmt(k.groups)],["بهره‌وری ناوگان",k.fill+"٪"],
    ["تأمین کلی",k.fulfil+"٪"],["تأمین‌نشده",fmt(k.unmet)]
  ].map(([l,v])=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join("");

  if(RESULT.issues.length) msg(`${RESULT.issues.length} مورد هشدار ثبت شد؛ در تب «هشدارها» ببینید.`,"warn");

  const names=Object.keys(RESULT.sheets);
  $("tabs").innerHTML=names.map(n=>`<button role="tab" data-n="${n}" aria-selected="false">${n} <span style="opacity:.6">(${RESULT.sheets[n].length})</span></button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>show(b.dataset.n)));
  $("result").classList.remove("hidden"); $("actions").classList.remove("hidden");
  show(names[0]);
}

function show(name){
  ACTIVE=name;
  $("tabs").querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected",b.dataset.n===name));
  const rows=RESULT.sheets[name];
  const thead=$("tbl").tHead,tbody=$("tbl").tBodies[0];
  if(!rows.length){ thead.innerHTML=""; tbody.innerHTML=`<tr><td style="white-space:normal">موردی برای نمایش نیست.</td></tr>`; $("rownote").textContent=""; return; }
  const cols=Object.keys(rows[0]);
  thead.innerHTML="<tr>"+cols.map(c=>`<th>${c}</th>`).join("")+"</tr>";
  const cap=rows.slice(0,400);
  tbody.innerHTML=cap.map(r=>"<tr>"+cols.map(c=>`<td>${typeof r[c]==="number"?fmt(r[c]):(r[c]??"")}</td>`).join("")+"</tr>").join("");
  $("rownote").textContent=rows.length>cap.length?`نمایش ${cap.length} ردیف از ${rows.length} ردیف — همه ردیف‌ها در فایل اکسل خروجی هستند.`:`${rows.length} ردیف`;
}

function download(){
  const wb=XLSX.utils.book_new();
  for(const [name,rows] of Object.entries(RESULT.sheets)){
    const ws=rows.length?XLSX.utils.json_to_sheet(rows):XLSX.utils.aoa_to_sheet([["موردی ثبت نشد"]]);
    ws["!views"]=[{RTL:true}];
    if(rows.length){
      ws["!cols"]=Object.keys(rows[0]).map(c=>({wch:Math.min(38,Math.max(12,c.length+4))}));
    }
    XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31));
  }
  XLSX.writeFile(wb,"خروجی-بهینه‌سازی-بار.xlsx");
}
</script>
